# Scrape config for the local stack (M21.2). Every service exposes the same
# `/metrics` on its own port; the label `service` is what the dashboard slices
# by, and it is set here rather than in the process because a process should not
# have to be told its own deployment name.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: panday
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels: { service: gateway }
      - targets: ["host.docker.internal:8082"]
        labels: { service: harnessd }
