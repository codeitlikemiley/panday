[workspace]
resolver = "2"
members = [
    "crates/panday-types",
    "crates/panday-sdk",
    "crates/panday-router",
    "crates/panday-reducer",
    "crates/panday-sandbox",
    "crates/panday-harness",
    "crates/panday-harnessd",
    "crates/panday-plugins",
    "crates/panday-gateway",
    "crates/panday-platform",
    "crates/panday-local",
    "crates/panday-cli",
    "xtask",
]
# A deliberately broken crate used as a test target (M13.2). It must NOT be
# built by the workspace — its test is supposed to fail until the harness
# fixes a copy of it.
exclude = ["crates/panday-harness/tests/fixture_repo"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "UNLICENSED"          # decide before anything is public
repository = ""
publish = false                 # nothing here goes to a registry (docs/00 §Naming)

# The T1 demo guest builds only for wasm32-wasip2 (see its own manifest).
exclude = ["fixtures/demo-tool"]

[workspace.dependencies]
panday-types = { path = "crates/panday-types" }
panday-sdk = { path = "crates/panday-sdk" }
panday-router = { path = "crates/panday-router" }
panday-reducer = { path = "crates/panday-reducer" }
panday-sandbox = { path = "crates/panday-sandbox" }
panday-harness = { path = "crates/panday-harness" }
panday-plugins = { path = "crates/panday-plugins" }
panday-gateway = { path = "crates/panday-gateway" }
panday-harnessd = { path = "crates/panday-harnessd" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# rustls only — docs/02: "no openssl linkage".
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
] }
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde-well-known", "macros"] }
# Router policy files are YAML (docs/12). Upstream serde_yaml is deprecated;
# serde_yaml_ng is its maintained continuation with the same derive API.
serde_yaml_ng = "0.10"
# plugin.toml (docs/16 names the file, so the format is part of the product).
toml = "0.9"
# `.plugin` archives are ed25519-signed (docs/16 §the package).
ed25519-dalek = { version = "2", features = ["rand_core"] }
# Content-addressed artifact refs — docs/03 specifies sha256.
sha2 = "0.10"
# grep tool (docs/13 native set) and the reducer's error-line matching.
regex = "1"
# WebSocket client for the sessions API (docs/10 M10.3). Approved as a table
# amendment: axum's server side already uses tungstenite underneath, so this keeps
# one implementation of RFC 6455 in the graph rather than a hand-rolled second one.
# rustls only, matching the reqwest policy — no openssl linkage.
tokio-tungstenite = { version = "0.28", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }
# T1 sandbox tier (docs/02 dependency table, docs/14 §tiers). Component model +
# fuel + epoch interruption; `wasmtime-wasi` is linked with an EMPTY capability
# set, which is what makes the tier's promise ("only the imports we grant") true
# for a guest that std links WASI into whether it uses it or not.
wasmtime = "47"
wasmtime-wasi = "47"
# ACP for editors (docs/02 dependency table, docs/16 §ACP bridge). The AEP⇄ACP
# mapping is written against the official crate's types rather than a private
# ACP-shaped struct, so M16.5 is transport wiring and not a second translation.
agent-client-protocol = "2"
# docs/02: "tracing | tracing + opentelemetry". The OTLP exporter uses the
# http-proto transport so it rides the reqwest/rustls stack already present
# rather than pulling in a second one (tonic/grpc).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "http-proto",
    "reqwest-client",
    "trace",
] }
# Optional in panday-types (feature `schema`), so the near-zero-dependency rule
# in docs/02 still holds for every normal build; only `cargo xtask schemas`
# turns it on.
schemars = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = "thin"
