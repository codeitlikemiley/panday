[workspace]
resolver = "2"
members = [
    "crates/panday-types",
    "crates/panday-sdk",
    "crates/panday-router",
    "crates/panday-reducer",
    "crates/panday-sandbox",
    "crates/panday-harness",
    "crates/panday-harnessd",
    "crates/panday-plugins",
    "crates/panday-gateway",
    "crates/panday-console",
    "crates/panday-platform",
    "crates/panday-local",
    "crates/panday-cli",
    "crates/panday-macros",
    "xtask",
]
# A deliberately broken crate used as a test target (M13.2). It must NOT be
# built by the workspace — its test is supposed to fail until the harness
# fixes a copy of it.
exclude = ["crates/panday-harness/tests/fixture_repo"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "UNLICENSED"          # decide before anything is public
repository = ""
publish = false                 # nothing here goes to a registry (docs/00 §Naming)

# The T1 demo guest builds only for wasm32-wasip2 (see its own manifest).
exclude = ["fixtures/demo-tool"]

[workspace.dependencies]
# macOS Keychain for the vault KEK (docs/25 M25.12). Approved 2026-08-22.
# Default features pull a Linux zbus backend we do not want; a backend-less
# build can fall back to an in-memory mock, and a KEK written to a mock is a
# lost KEK and an unreadable vault. Apple store only, and only on macOS.
keyring = { version = "4", default-features = false, features = ["v1", "apple-native-keyring-store"] }
# `keyring` enables the Apple backend but not which Apple store to use, and that
# crate refuses to compile without one. Named directly so the `keychain` feature
# is unified into keyring's copy; `keychain` is the ordinary login Keychain,
# `protected` is the data-protection variant that needs an entitlement we do not
# have.
apple-native-keyring-store = { version = "1", default-features = false, features = ["keychain"] }
panday-types = { path = "crates/panday-types" }
panday-sdk = { path = "crates/panday-sdk" }
panday-router = { path = "crates/panday-router" }
panday-reducer = { path = "crates/panday-reducer" }
panday-sandbox = { path = "crates/panday-sandbox" }
panday-harness = { path = "crates/panday-harness" }
panday-plugins = { path = "crates/panday-plugins" }
panday-gateway = { path = "crates/panday-gateway" }
panday-console = { path = "crates/panday-console" }
panday-harnessd = { path = "crates/panday-harnessd" }
panday-macros = { path = "crates/panday-macros" }
panday-platform = { path = "crates/panday-platform" }
panday-local = { path = "crates/panday-local" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# rustls only — docs/02: "no openssl linkage".
axum = { version = "0.8", features = ["ws", "form"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
] }
# `v4` alongside `v7` (M17.3): ids are time-ordered (v7) but *secrets* must not be — a v7 key would
# carry its own creation time and 48 fewer random bits. Both generators come from the same approved
# dependency; this is a feature choice, not a new one.
uuid = { version = "1", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde-well-known", "macros"] }
# Router policy files are YAML (docs/12). Upstream serde_yaml is deprecated;
# serde_yaml_ng is its maintained continuation with the same derive API.
serde_yaml_ng = "0.10"
# plugin.toml (docs/16 names the file, so the format is part of the product).
toml = "1"
# `.plugin` archives are ed25519-signed (docs/16 §the package).
ed25519-dalek = { version = "3", features = ["rand_core"] }
# Content-addressed artifact refs — docs/03 specifies sha256.
sha2 = "0.11"
# Upstream credential vault (docs/25). Retrievable secrets: AEAD, not a hash.
# `std` on chacha20poly1305 pulls `alloc` + `getrandom`; we do not enable `heapless`.
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
# grep tool (docs/13 native set) and the reducer's error-line matching.
regex = "1"
# Proc-macro toolchain for `#[tool]` (docs/10 M10.4). `syn`/`quote`/`proc-macro2` are
# the only way to write a proc macro in Rust; they are build-time only and appear in
# no shipped binary.
# The offline event store (docs/02's DB row, docs/18 §Composition). SQLite only here —
# `sqlite-bundled` so a laptop needs no system library, and no TLS features because a
# file has no transport. Postgres joins the same crate at M3.5.
sqlx = { version = "0.9", default-features = false, features = [
    "sqlite",
    "sqlite-bundled",
    "postgres",
    "uuid",
    # `time`, not `chrono`: docs/02 picks one date library and sqlx offers both. Enabling
    # chrono here would have widened M16.3's narrow exemption into "anything may pull it",
    # which `cargo deny` caught on the first build.
    "time",
    "json",
    "runtime-tokio",
    # rustls only, matching the reqwest policy — docs/02: "no openssl linkage".
    "tls-rustls-ring",
] }
# `.plugin` archives (docs/16 §the package). Pure Rust, no C: `flate2`'s default backend is
# `miniz_oxide`, so this adds no system dependency and nothing to cross-compile. Extraction is
# ours rather than `tar`'s convenience API — an untrusted archive gets path and link checks
# before anything touches the filesystem.
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# MCP host (docs/02 dependency table, docs/16 §MCP host). **stdio only** — the
# `transport-child-process` feature and nothing that opens a socket: the streamable
# HTTP transport and the OAuth flows stay unbuilt until they are asked for, so this
# dependency cannot reach the network at all.
rmcp = { version = "3", default-features = false, features = [
    "client",
    "transport-child-process",
] }
# WebSocket client for the sessions API (docs/10 M10.3). Approved as a table
# amendment: axum's server side already uses tungstenite underneath, so this keeps
# one implementation of RFC 6455 in the graph rather than a hand-rolled second one.
# rustls only, matching the reqwest policy — no openssl linkage.
tokio-tungstenite = { version = "0.29", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }
# T1 sandbox tier (docs/02 dependency table, docs/14 §tiers). Component model +
# fuel + epoch interruption; `wasmtime-wasi` is linked with an EMPTY capability
# set, which is what makes the tier's promise ("only the imports we grant") true
# for a guest that std links WASI into whether it uses it or not.
wasmtime = "47"
wasmtime-wasi = "47"
# ACP for editors (docs/02 dependency table, docs/16 §ACP bridge). The AEP⇄ACP
# mapping is written against the official crate's types rather than a private
# ACP-shaped struct, so M16.5 is transport wiring and not a second translation.
agent-client-protocol = "2"
# docs/02: "tracing | tracing + opentelemetry". The OTLP exporter uses the
# http-proto transport so it rides the reqwest/rustls stack already present
# rather than pulling in a second one (tonic/grpc).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "http-proto",
    "reqwest-client",
    "trace",
] }
# Optional in panday-types (feature `schema`), so the near-zero-dependency rule
# in docs/02 still holds for every normal build; only `cargo xtask schemas`
# turns it on.
schemars = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = "thin"
