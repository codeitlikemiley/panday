[workspace]
resolver = "2"
members = [
    "crates/ferrum-types",
    "crates/ferrum-sdk",
    "crates/ferrum-router",
    "crates/ferrum-reducer",
    "crates/ferrum-sandbox",
    "crates/ferrum-harness",
    "crates/ferrum-harnessd",
    "crates/ferrum-plugins",
    "crates/ferrum-gateway",
    "crates/ferrum-platform",
    "crates/ferrum-local",
    "crates/ferrum-cli",
    "xtask",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "UNLICENSED"          # decide before anything is public
repository = ""
publish = false                 # nothing here goes to a registry (docs/00 §Naming)

[workspace.dependencies]
ferrum-types = { path = "crates/ferrum-types" }
ferrum-sdk = { path = "crates/ferrum-sdk" }
ferrum-router = { path = "crates/ferrum-router" }
ferrum-reducer = { path = "crates/ferrum-reducer" }
ferrum-sandbox = { path = "crates/ferrum-sandbox" }
ferrum-harness = { path = "crates/ferrum-harness" }
ferrum-plugins = { path = "crates/ferrum-plugins" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# rustls only — docs/02: "no openssl linkage".
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
] }
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde-well-known", "macros"] }
# Optional in ferrum-types (feature `schema`), so the near-zero-dependency rule
# in docs/02 still holds for every normal build; only `cargo xtask schemas`
# turns it on.
schemars = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = "thin"
