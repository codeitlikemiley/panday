[package]
name = "xtask"
description = "Repo automation (docs/02 §Toolchain: the cargo xtask pattern, not build.rs cleverness)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
panday-types = { workspace = true, features = ["schema"] }
schemars.workspace = true
panday-router.workspace = true
# For the OpenAPI document, which lives with the handlers it describes (M10.6).
panday-gateway.workspace = true
# `json-bench` runs against a live gateway (M19.1).
panday-harness.workspace = true
panday-sdk.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
serde_json.workspace = true
