[package]
name = "panday-plugins"
description = "Plugin packaging, skills, MCP host, hooks. Spec: docs/16-plugins.md"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
panday-types.workspace = true
rmcp.workspace = true
tar.workspace = true
flate2.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
serde.workspace = true
serde_yaml_ng.workspace = true
toml.workspace = true
ed25519-dalek.workspace = true
# Entitlement expiry (M17.6) is a date comparison, and dates are not something to hand-roll.
time.workspace = true
sha2.workspace = true
thiserror.workspace = true

# A foreign MCP server for the M16.3 suite — hand-written against the wire rather
# than built with rmcp's server half, so the test proves interop rather than
# self-agreement.
[dev-dependencies]
# The suite builds hostile archives by hand — a symlink entry cannot be made with the
# convenience API.
tar.workspace = true
flate2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-util"] }

# Outside `tests/` so cargo does not also auto-discover it as an integration test —
# it warns about the double role, and running a stdio server as a test hangs on
# stdin.
[[bin]]
name = "fixture-mcp-server"
path = "fixtures/mcp_server.rs"
test = false
