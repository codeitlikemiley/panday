[package]
name = "panday-sandbox"
description = "Tiered execution: T0 in-proc, T1 WASM, T2 OS jail, T3 microVM. Spec: docs/14-sandbox.md"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
panday-types.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true
serde.workspace = true
thiserror.workspace = true
async-trait.workspace = true
futures-core.workspace = true

futures-util.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "sync", "time", "macros", "rt"] }

[dev-dependencies]
# Hand-written components for the escape suite: a WAT string is the only way to
# build a guest that imports something the world does not grant.
wat = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
