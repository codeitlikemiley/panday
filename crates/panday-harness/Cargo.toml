[package]
name = "panday-harness"
description = "The session actor and turn state machine. Spec: docs/13-harness.md"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
panday-types.workspace = true
panday-sdk.workspace = true
panday-sandbox.workspace = true
panday-reducer.workspace = true
panday-plugins.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
schemars.workspace = true
futures-util.workspace = true
regex.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["time", "macros", "rt"] }
time.workspace = true

[dev-dependencies]
# Compile-fail UI tests for `#[tool]` (docs/10 M10.4). Approved as a dev-dependency:
# a proc macro's error messages are most of its quality, and there is no other way to
# assert that bad code fails to compile *with a good message*.
trybuild = "1"
axum.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
futures-core.workspace = true
panday-gateway.workspace = true
panday-router.workspace = true
