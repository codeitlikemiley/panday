[package]
name = "panday-cli"
description = "The terminal client (ratatui) + ACP server. Spec: docs/16-plugins.md §ACP, ADR-012"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
# The docs say `panday chat`, `panday acp`, `panday local` — the binary must
# actually be called that, not `panday-cli`.
name = "panday"
path = "src/main.rs"

[dependencies]
panday-types.workspace = true
panday-sdk.workspace = true
panday-gateway.workspace = true
panday-harness.workspace = true
reqwest.workspace = true
panday-plugins.workspace = true
tracing.workspace = true
panday-sandbox.workspace = true
panday-reducer.workspace = true
agent-client-protocol.workspace = true
serde_json.workspace = true
uuid.workspace = true
panday-router.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
time.workspace = true
panday-platform.workspace = true
# The dogfood suite (M10.3) drives the real service over a real socket.
panday-harnessd.workspace = true
axum.workspace = true
