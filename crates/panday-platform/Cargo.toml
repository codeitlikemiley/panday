[package]
name = "panday-platform"
description = "Accounts, entitlements, ledger, billing. Spec: docs/17-platform.md"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
panday-types.workspace = true
panday-plugins.workspace = true
tracing.workspace = true
async-trait.workspace = true
panday-sdk.workspace = true
panday-gateway.workspace = true
panday-sandbox.workspace = true
panday-harness.workspace = true
sha2.workspace = true
axum.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
time.workspace = true
# `rt` only: the route audit hands its write to a background task so inference never waits on the
# database (src/routes.rs). The runtime itself is the binary's to choose.
# `rt` for the route audit's background write; the service binary needs a real runtime and a
# listener, and `macros` for `#[tokio::main]`.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net"] }
panday-router.workspace = true

[dev-dependencies]
async-trait.workspace = true
time.workspace = true
futures-util.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
