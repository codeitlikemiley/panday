# The default model catalog (docs/12 M12.2).
#
# What the pool patterns in policy/*.yaml resolve to. Order within a provider is preference: a
# glob expands in the order written here, and that order becomes the failover chain.
#
# `context` is the context the model is *usable* at, not the advertised number. Profiles are
# `declared` until the eval suite measures them (docs/19 M19.2). A measured row says so.
#
# Prices are micro-dollars per million tokens: 3_000_000 is $3.00/Mtok. A model with no `price` is
# *unpriced*, which the meter reports as such; it is not free. Local models carry an explicit zero,
# because "this reduction saved no money" is a true and useful statement (ADR-007).
#
# Prices change without warning. This file is a starting point a deployment overrides, not a
# billing source of truth — the ledger prices from what it was configured with at call time.
#
# Together and local rows exist so a deployment that *has* those backends can route to them.
# The operator console and GET /v1/models do **not** dump this file: they ask each signed-in
# provider. This file is prices, measured context, and pool preference.
version: 1

models:
  # --- frontier -----------------------------------------------------------------------------
  # Anthropic's most capable generally-available model (API id `claude-fable-5`).
  # Mythos 5 is the same weights with fewer safeguards, invitation-only — not listed.
  - id: anthropic/claude-fable-5
    context: 1000000
    json: 0.99
    tools: 0.99
    vision: true
    max_subagents: 4
    price:
      input_per_mtok_micros: 10000000
      output_per_mtok_micros: 50000000
      cache_read_pct: 10
      cache_write_pct: 125
      cache_write_1h_pct: 200

  - id: anthropic/claude-opus-5
    context: 1000000
    json: 0.99
    tools: 0.98
    vision: true
    max_subagents: 4
    price:
      input_per_mtok_micros: 5000000
      output_per_mtok_micros: 25000000
      cache_read_pct: 10
      cache_write_pct: 125
      cache_write_1h_pct: 200

  - id: openai/gpt-5.6-sol
    context: 1000000
    json: 0.99
    tools: 0.98
    vision: true
    max_subagents: 4
    price:
      input_per_mtok_micros: 5000000
      output_per_mtok_micros: 30000000
      # Automatic prefix caching: reads are discounted, writes carry no premium (ADR-007).
      cache_read_pct: 10
      cache_write_pct: 100
      cache_write_1h_pct: 100

  # --- workhorse ----------------------------------------------------------------------------
  - id: anthropic/claude-sonnet-5
    context: 1000000
    json: 0.98
    tools: 0.96
    vision: true
    max_subagents: 3
    price:
      input_per_mtok_micros: 2000000
      output_per_mtok_micros: 10000000
      cache_read_pct: 10
      cache_write_pct: 125
      cache_write_1h_pct: 200

  - id: openai/gpt-5.6-terra
    context: 1000000
    json: 0.97
    tools: 0.95
    vision: true
    max_subagents: 3
    price:
      input_per_mtok_micros: 2000000
      output_per_mtok_micros: 12000000
      cache_read_pct: 10
      cache_write_pct: 100
      cache_write_1h_pct: 100

  # Subscription OAuth (Grok CLI ~/.grok/auth.json) — unpriced until we meter xAI.
  # measured 2026-08-20 — max_context_tokens, json_reliability, tool_reliability
  # (probes: 64528✓ 63520✓ 61503✓ 57469✓ 49402✓ 33268✓). Ceiling was 65536, so
  # 64528 is the largest verified size, not the spec-sheet 256k. vision and
  # max_subagents are carried from the previous declared row: a text probe
  # cannot measure them.
  - id: xai/grok-4.6
    context: 64528
    json: 1.00
    tools: 1.00
    vision: true
    max_subagents: 3
    provenance: measured

  - id: gemini/gemini-2.5-flash
    context: 1000000
    json: 0.95
    tools: 0.9
    vision: true
    max_subagents: 3

  - id: together/qwen3.5-32b-instruct
    context: 128000
    json: 0.9
    tools: 0.85
    max_subagents: 2
    price:
      input_per_mtok_micros: 800000
      output_per_mtok_micros: 800000

  # --- cheap --------------------------------------------------------------------------------
  - id: openai/gpt-5.6-luna
    context: 1000000
    json: 0.9
    tools: 0.88
    vision: true
    max_subagents: 2
    price:
      input_per_mtok_micros: 200000
      output_per_mtok_micros: 1200000
      cache_read_pct: 10
      cache_write_pct: 100
      cache_write_1h_pct: 100

  - id: together/qwen3.5-9b
    context: 64000
    json: 0.82
    tools: 0.7
    max_subagents: 1
    price:
      input_per_mtok_micros: 200000
      output_per_mtok_micros: 200000

  # --- local (docs/18) ----------------------------------------------------------------------
  # No marginal token cost, so an explicit zero rather than an omitted price.
  - id: local/qwen3.5-4b
    context: 16000
    json: 0.7
    tools: 0.6
    max_subagents: 1
    price:
      input_per_mtok_micros: 0
      output_per_mtok_micros: 0

  - id: local/gpt-oss-20b
    context: 32000
    json: 0.85
    tools: 0.75
    max_subagents: 2
    price:
      input_per_mtok_micros: 0
      output_per_mtok_micros: 0
