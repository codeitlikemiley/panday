name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  # Lane 1 — fast fail: fmt + clippy (docs/02 §CI shape).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Lane 1b — license + advisory graph. Runs from day one (docs/02).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # Lane 2 — unit suite via nextest. No network, no docker; budget: 3 minutes.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-nextest }
      # T2 Linux (docs/14 M14.2) jails through bubblewrap, and its escape suite skips itself
      # without it. Best-effort here, required nightly — see below.
      #
      # The history: an apt mirror stall once hung this step for 3.5 hours, so it was bounded and
      # retried; then GitHub's Azure Ubuntu mirror went dark for an afternoon and all three retries
      # hit the same dead host, which failed every PR on this repo for reasons that had nothing to
      # do with the code. A mirror outage is not an isolation regression, and blocking work on one
      # teaches people to ignore a red tick.
      #
      # So: PR CI installs if it can and says loudly if it could not, and `.github/workflows/
      # nightly.yml` *requires* bubblewrap and fails without it. An isolation regression is caught
      # within a day; an outage at Microsoft is not our merge queue's problem.
      - name: install bubblewrap
        id: bwrap
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set -eux
          for attempt in 1 2; do
            if sudo apt-get update -o Acquire::Retries=1 && \
               sudo apt-get install -y --no-install-recommends bubblewrap; then
              exit 0
            fi
            echo "attempt $attempt failed; retrying"
            sleep 5
          done
          exit 1
      # Ubuntu 24.04 ships `kernel.apparmor_restrict_unprivileged_userns=1`, which stops bwrap
      # creating the user namespace it is built on — it installs fine and then fails with
      # "loopback: Failed RTM_NEWADDR: Operation not permitted". The runner gives us passwordless
      # sudo, so the restriction is lifted here rather than the suite being abandoned. It is a
      # property of the CI box, not of the sandbox: a real deployment either allows userns (docs/14
      # T2) or uses T3.
      - name: allow unprivileged user namespaces
        continue-on-error: true
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: check the jail actually works
        run: |
          if ! command -v bwrap >/dev/null; then
            echo "::warning title=T2 escape suite skipped::bubblewrap could not be installed \
          (apt mirror). The Linux isolation suite did not run in this job; the nightly job \
          requires it."
            exit 0
          fi
          if bwrap --unshare-all \
            --ro-bind /usr /usr \
            --symlink usr/bin /bin --symlink usr/lib /lib \
            --symlink usr/lib64 /lib64 --symlink usr/sbin /sbin \
            -- /usr/bin/true; then
            echo "bwrap jails work"
          else
            echo "::warning title=T2 escape suite skipped::bubblewrap cannot create a user \
          namespace on this runner. The Linux isolation suite did not run in this job; the nightly \
          job requires it."
          fi
      - run: cargo nextest run --workspace --profile ci
      # nextest does not run doctests; docs/02 wants them gated too.
      - run: cargo test --workspace --doc
      # docs/03 M3.2: a schema change without a regenerated proto/ fails.
      - run: cargo xtask schemas --check
      # docs/20 M20.5: a dependency change without a regenerated SBOM fails, because an SBOM that
      # disagrees with the lockfile describes a build nobody is making.
      - run: cargo xtask sbom --check
      # docs/19 §19.6: the Python island is not built or run in CI — no GPU, no GGUF — but a syntax
      # error in it should not wait for somebody to run an eval. A green tick that meant "we did not
      # measure" would be worse than no job at all, so this checks that it parses and nothing more.
      - run: python3 -m compileall -q training

  # docs/10 M10.6. Separate from the lint job because it needs a JavaScript runtime, and the point
  # of generating the SDK is that the result compiles — a check that only compares bytes would pass
  # on a file no TypeScript compiler accepts.
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: sdk
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      # A protocol or ingress change that forgets the SDK fails here, not in a user's build.
      - run: cargo xtask ts-sdk --check
      - run: deno check sdk/typescript/src/index.ts

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with: { tool: mdbook }
      - run: mdbook build docs

  # Lane 3 — the integration lane (docs/02 §CI shape step 3). Postgres and MinIO as service
  # containers rather than a compose file: Actions starts them before the job and health-checks
  # them, which is the one thing compose would add here.
  #
  # `--run-ignored all` with a binary filter, not a blanket `--ignored`: the other ignored tests
  # are a wall-clock benchmark (M11.6) and a live llama-server leg (M18.1), and neither can pass
  # on a shared runner. A lane that ran them would be a lane that is always red.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: panday
          POSTGRES_PASSWORD: panday
          POSTGRES_DB: panday_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U panday -d panday_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # MinIO is deliberately *not* here yet. No test needs object storage — artifacts spill to
      # memory today (docs/15) — and a service container nothing uses is a failure mode with no
      # benefit: this job went red because `bitnami/minio:latest` stopped existing, for a service the
      # suite never connected to. It is in `deploy/integration-compose.yml` for local use, and it
      # comes back here with the first test that reads a bucket.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-nextest }
      - env:
          PANDAY_TEST_DATABASE_URL: postgres://panday:panday@127.0.0.1:5433/panday_test
        # The whole platform crate, not one binary: the ledger, rebuild and sandbox lanes are all
        # `#[ignore]`d PG tests, and a filter naming one file silently stopped covering the others as
        # soon as they were added (which it did, for three commits).
        run: cargo nextest run --run-ignored all -E 'package(panday-platform)'
