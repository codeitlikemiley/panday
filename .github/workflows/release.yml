name: release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# docs/02 §CI shape item 4: "cargo build --release for linux-x86_64 + aarch64
# (cross), macOS on tag". Linux builds run on every push so a break is caught
# immediately; the macOS leg is tag-only because it needs a different runner and
# nothing about it can regress from a Linux-only change.
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            cross: false
          - target: aarch64-unknown-linux-gnu
            cross: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Explicit rather than via the action's `targets:` input: a matrix
      # expression there silently did not expand, and the resulting failure was
      # "can't find crate for `core`" during a dependency build — which reads
      # like a broken toolchain rather than a missing target.
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # aarch64 needs a cross linker; `ring` (via rustls) also needs a cross C
      # compiler, which is why this is not just `--target`.
      - if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - run: cargo build --release --workspace --target ${{ matrix.target }}
      - run: ./scripts/check-binary-sizes.sh target/${{ matrix.target }}/release

      - uses: actions/upload-artifact@v7
        with:
          name: panday-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/panday
            target/${{ matrix.target }}/release/panday-gateway
            target/${{ matrix.target }}/release/panday-harnessd
          if-no-files-found: error

  macos:
    # Tag-only, per docs/02.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos
      - run: cargo build --release --workspace --target aarch64-apple-darwin
      - run: ./scripts/check-binary-sizes.sh target/aarch64-apple-darwin/release
      - uses: actions/upload-artifact@v7
        with:
          name: panday-aarch64-apple-darwin
          path: |
            target/aarch64-apple-darwin/release/panday
            target/aarch64-apple-darwin/release/panday-gateway
            target/aarch64-apple-darwin/release/panday-harnessd
          if-no-files-found: error

  # M20.5 — what a tag actually ships: the binaries, an SBOM, checksums, and a signature over the
  # checksums.
  #
  # Keyless (sigstore/OIDC), so there is no private key to store, rotate, or leak: the signature is
  # bound to this workflow's identity in a public transparency log, and a verifier checks *that*
  # rather than trusting a key we would otherwise have to protect. It also means a fork cannot
  # produce a signature that verifies against our identity.
  sign:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The OIDC token cosign exchanges for a short-lived certificate. Nothing else here needs it.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Regenerated rather than downloaded: the SBOM must describe the tree this tag points at, and
      # a checked-in file that drifted is exactly what `--check` exists to catch.
      - run: cargo run -p xtask -- sbom --check
      - run: cp sbom.cdx.json artifacts/

      # One checksum file over everything, because signing N files means verifying N signatures and
      # nobody does that. Sign the manifest; the manifest covers the artifacts.
      - name: checksums
        working-directory: artifacts
        run: |
          find . -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - uses: sigstore/cosign-installer@v3
      - name: sign the checksums
        working-directory: artifacts
        run: |
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/panday
            artifacts/**/panday-gateway
            artifacts/**/panday-harnessd
            artifacts/SHA256SUMS
            artifacts/SHA256SUMS.sig
            artifacts/SHA256SUMS.pem
            artifacts/sbom.cdx.json
          fail_on_unmatched_files: true
          body: |
            Verify before running anything here:

            ```sh
            cosign verify-blob \
              --certificate SHA256SUMS.pem \
              --signature SHA256SUMS.sig \
              --certificate-identity-regexp 'https://github.com/${{ github.repository }}/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              SHA256SUMS
            sha256sum -c SHA256SUMS
            ```

            `sbom.cdx.json` (CycloneDX 1.5) lists every dependency this build resolved.
