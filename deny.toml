# cargo-deny — license and advisory gating (docs/02-workspace.md).
#
# "You are building a commercial product; know your license graph early."
# This runs in CI from day one. Adding a dependency that trips it is a
# conversation, not a `skip`.

[graph]
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
# Permissive only. Anything copyleft entering the graph must be a deliberate,
# discussed decision — the workspace itself ships UNLICENSED (see Cargo.toml).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    # webpki-roots — the Mozilla CA root bundle that rustls ships. CDLA-P-2.0
    # is a permissive *data* licence covering the certificate list itself
    # (no copyleft, no attribution burden on our binaries).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
# Our own crates carry `license = "UNLICENSED"`, which is not an SPDX id.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own `path` deps inside the workspace carry no version req; that is the
# intended shape, not a wildcard from crates.io.
allow-wildcard-paths = true
# docs/02: "time or chrono — pick ONE (we pick `time`), enforce with clippy".
# Enforcing it here too: cheaper than a lint, and it catches transitive pulls.
#
# ONE exception, added at M16.3: `rmcp` (the official MCP SDK, which docs/16 names)
# depends on chrono unconditionally on non-wasm targets. The ban's purpose is that
# *our* code has one date library, and that still holds — nothing of ours may use
# chrono, and no other crate may pull it in. `wrappers` is how that distinction is
# expressed: chrono is allowed only where rmcp brings it, so adding it anywhere else
# still fails the build.
deny = [{ crate = "chrono", reason = "docs/02 picks `time`; chrono must not enter the graph except inside rmcp (M16.3)", wrappers = ["rmcp"] }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
